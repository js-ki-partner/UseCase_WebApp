# Lokale Entwicklungsdatenbank. Produktion nutzt die vorhandene Postgres-Instanz auf dem VPS.
services:
  db:
    image: postgres:16-alpine
    container_name: ucradar-db
    environment:
      POSTGRES_USER: ucradar
      POSTGRES_PASSWORD: ucradar
      POSTGRES_DB: ucradar
    ports:
      - "5433:5432"
    volumes:
      - ucradar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucradar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ucradar-db-data:
