# Vorlage für secrets.enc.yaml (UC-Radar).
#
# Auf dem VPS anlegen:
#   cd /opt/stacks/ucradar
#   cp secrets.example.yaml secrets.enc.yaml
#   sops secrets.enc.yaml        # Werte eintragen, Speichern verschlüsselt automatisch
#
# secrets.enc.yaml (Chiffretext) darf ins Repo. Diese Klartext-Vorlage enthält
# keine echten Werte.

DATABASE_URL: postgresql://ucradar:CHANGEME@db:5432/ucradar?schema=public
APP_BASE_URL: https://ideen.ki-partner.tech

SESSION_SECRET: CHANGEME-openssl-rand-base64-36
TOKEN_HASH_SECRET: CHANGEME-openssl-rand-base64-36

OP_BASE_URL: https://openproject.ki-partner.tech
OP_API_KEY: CHANGEME
OP_MAPPING_FILE: ./openproject-mapping.json

SMTP_URL: smtps://user:pass@mail.example.tld:465
MAIL_FROM: UC-Radar <ideen@ki-partner.tech>

# Bearer-Token für die Cron-Jobs /api/jobs/*  (openssl rand -hex 24)
JOB_TOKEN: CHANGEME

# KI-Anreicherung: leer lassen => aus (Standard).
KI_PROVIDER: ""
KI_BASE_URL: ""
KI_API_KEY: ""
KI_MODELL: gpt-4o-mini
KI_ANBIETER_NAMEN: OpenAI oder Google AI

# nur für den db-Service in docker-compose.prod.yml
POSTGRES_USER: ucradar
POSTGRES_PASSWORD: CHANGEME
POSTGRES_DB: ucradar
